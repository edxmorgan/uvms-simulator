controller_manager:
  ros__parameters:
    update_rate: 200  # Hz
    is_async: True

    auxiliary_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    estimated_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

# get vehicle base to manipulator base TF
# ros2 run tf2_ros tf2_echo base_link alpha_base_link 

joint_state_broadcaster:
  ros__parameters:
    use_local_topics: true
    map_interface_to_joint_state:
      effort: effort
      position: position
      velocity: velocity
      acceleration: acceleration
      current: current
      stateId: stateId

# Isolate remapping: the standard DynamicJointState must retain original names.
estimated_joint_state_broadcaster:
  ros__parameters:
    use_local_topics: true
    interfaces: [filtered_position, filtered_velocity]
    map_interface_to_joint_state:
      position: filtered_position
      velocity: filtered_velocity

# Only non-estimated auxiliary joints (e.g. thrusters); names filled from URDF.
auxiliary_joint_state_broadcaster:
  ros__parameters:
    use_local_topics: true
    interfaces: [position]
